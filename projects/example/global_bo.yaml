use_instrument_div_mult_estimates: True
#instrument_div_multiplier: 2.1
forecast_weights:
  breakout10: 0
  breakout20: 0
  breakout40: 0.25
  breakout80: 0.25
  breakout160: 0.25
  breakout320: 0.25
forecast_div_multiplier: 1.17

#
# forecast combination
#


# DEFAULT ZONE ---------------------------------

trading_rules:
  breakout10:
    function: systems.provided.rules.breakout.breakout
    data:
      - "rawdata.get_daily_prices"
    other_args:
      lookback: 10
    forecast_scalars: 0.60
  breakout20:
    function: systems.provided.rules.breakout.breakout
    data:
      - "rawdata.get_daily_prices"
    other_args:
      lookback: 20
    forecast_scalars: 0.67
  breakout40:
    function: systems.provided.rules.breakout.breakout
    data:
      - "rawdata.get_daily_prices"
    other_args:
      lookback: 40
    forecast_scalars: 0.70
  breakout80:
    function: systems.provided.rules.breakout.breakout
    data:
      - "rawdata.get_daily_prices"
    other_args:
      lookback: 80
    forecast_scalars: 0.73
  breakout160:
    function: systems.provided.rules.breakout.breakout
    data:
      - "rawdata.get_daily_prices"
    other_args:
      lookback: 160
    forecast_scalars: 0.74
  breakout320:
    function: systems.provided.rules.breakout.breakout
    data:
      - "rawdata.get_daily_prices"
    other_args:
      lookback: 320
    forecast_scalars: 0.74

forecast_cap: 20.0

# Buffer
buffer_trade_to_edge: True
buffer_method: forecast
buffer_size: 0.10

# Capital
base_currency: "USD"
capital_multiplier:
   func: syscore.capital.full_compounding
