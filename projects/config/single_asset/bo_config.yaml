#
# >>> INPUT ZONE ---------------------------------
#

# Note: Date
#start_date: "2019-10-01"
#end_date: '2024-01-01'

# Note: Capital
percentage_vol_target: 14
notional_trading_capital: 10000000

# Note: Weight
instrument_weights:
    IRON: 0.5
    GOLD_micro: 0.5

#use_instrument_div_mult_estimates: True
instrument_div_multiplier: 1

# Note: Forecast
forecast_weights:
  carry: 1

forecast_div_multiplier: 1



#
# DEFAULT ZONE ---------------------------------
#

trading_rules:
  carry:
     function: systems.provided.rules.carry.carry
     data:
         - "rawdata.raw_carry"
     other_args:
         smooth_days: 90
     forecast_scalar: 30
forecast_cap: 20.0

# Buffer
buffer_trade_to_edge: True
buffer_method: forecast
buffer_size: 0.10

# Capital
base_currency: "USD"
capital_multiplier:
   func: syscore.capital.full_compounding