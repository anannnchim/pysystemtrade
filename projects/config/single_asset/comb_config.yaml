  CRUDE_W_micro: 1
  ETHER-micro: 1
  EU-BANKS: 1
  EUR_micro: 1
  FTSECHINAA: 1
  GAS_US_mini: 1
  GBP_micro: 1
  GOLD_micro: 1
  IRON: 1
  JGB-SGX-mini: 1
  KRWUSD_mini: 1
  MILLWHEAT: 1
  MUMMY: 1
  MXP: 1
  RUSSELL: 1
  SOYBEAN_mini: 1
  US10: 1
  V2X: 1
  VIX_mini: 1
  WHEAT_mini: 1
  LEANHOG: 1
  LIVECOW: 1
  RICE: 1
  PLAT: 1
  SILVER: 1
  OAT: 1
