# Note: Capital
percentage_vol_target: 20
notional_trading_capital: 100000000

# Note: Weight
instrument_weights:
  AUD_micro: 1
  BBCOMM: 1
  BRE: 1
  CAD2: 1
  CAD10: 1
  CAD_micro: 1
  CANOLA: 1
  COPPER-micro: 1
  CORN: 1
