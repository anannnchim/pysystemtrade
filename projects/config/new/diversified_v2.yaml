# This will affect capital by portfolio multiplier
start_date: "2000-12-01"
# Capital correction
#
percentage_vol_target: 20
notional_trading_capital: 42000

base_currency: "USD"
capital_multiplier:
   func: syscore.capital.full_compounding

instrument_weights:

  # 1. FX
  MXP: 0.10 # EM
  GBP_micro: 0.033   # DEV
  AUD_micro: 0.033

  # 2. Ags: Grain
  CORN_mini: 0.083
  WHEAT_mini: 0.083

  # 3. OilGas: Oil,Gas
  CRUDE_W_micro: 0.167

  # 4. Metals: Industrial
  IRON: 0.167

  # 5. Bond: Asia
  JGB-SGX-mini: 0.167

  # 6. Equity
  EU-BANKS: 0.083 # Europe
  MUMMY: 0.083 # Asia

#use_instrument_div_mult_estimates: True
instrument_div_multiplier: 2.1

