# ===== DEFAULT ZONE =====
use_instrument_div_mult_estimates: true
forecast_weights:
    ewmac2_8: 0
    ewmac4_16: 0
    ewmac8_32: 0
    ewmac16_64: 0.17
    ewmac32_128: 0.17
    ewmac64_256: 0.17
    breakout10: 0
    breakout20: 0
    breakout40: 0
    breakout80: 0.17
    breakout160: 0.17
    breakout320: 0.17
forecast_div_multiplier: 1.27
base_currency: "USD"
capital_multiplier:
  func: syscore.capital.full_compounding

trading_rules:
  ewmac2_8:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args: { Lfast: 2, Lslow: 8 }
    forecast_scalar: 10.6
  ewmac4_16:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args: { Lfast: 4, Lslow: 16 }
    forecast_scalar: 7.5
  ewmac8_32:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args: { Lfast: 8, Lslow: 32 }
    forecast_scalar: 5.3
  ewmac16_64:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args: { Lfast: 16, Lslow: 64 }
    forecast_scalar: 3.75
  ewmac32_128:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args: { Lfast: 32, Lslow: 128 }
    forecast_scalar: 2.65
  ewmac64_256:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args: { Lfast: 64, Lslow: 256 }
    forecast_scalar: 1.87
  breakout10:
    function: systems.provided.rules.breakout.breakout
    data:
      - "rawdata.get_daily_prices"
    other_args:
      lookback: 10
    forecast_scalars: 0.60
  breakout20:
    function: systems.provided.rules.breakout.breakout
    data:
      - "rawdata.get_daily_prices"
    other_args:
      lookback: 20
    forecast_scalars: 0.67
  breakout40:
    function: systems.provided.rules.breakout.breakout
    data:
      - "rawdata.get_daily_prices"
    other_args:
      lookback: 40
    forecast_scalars: 0.70
  breakout80:
    function: systems.provided.rules.breakout.breakout
    data:
      - "rawdata.get_daily_prices"
    other_args:
      lookback: 80
    forecast_scalars: 0.73
  breakout160:
    function: systems.provided.rules.breakout.breakout
    data:
      - "rawdata.get_daily_prices"
    other_args:
      lookback: 160
    forecast_scalars: 0.74
  breakout320:
    function: systems.provided.rules.breakout.breakout
    data:
      - "rawdata.get_daily_prices"
    other_args:
      lookback: 320
    forecast_scalars: 0.74

forecast_cap: 20.0

rule_groups:
  ewmac_fast:   [ewmac2_8,  ewmac4_16]
  ewmac_medium: [ewmac8_32, ewmac16_64]
  ewmac_slow:   [ewmac32_128, ewmac64_256]

style_groups:
  trend:
    - ewmac_fast
    - ewmac_medium
    - ewmac_slow

buffer_trade_to_edge: true
buffer_method: forecast
buffer_size: 0.10
